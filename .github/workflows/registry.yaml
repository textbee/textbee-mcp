# Manual retry for publishing the server to the official MCP Registry.
#
# The normal path is the registry job at the end of release.yaml, which runs
# right after the npm publish. Releases created by GITHUB_TOKEN do not fire
# the `release` event, so this workflow cannot hang off that event; it exists
# for re-running a publish by hand. Ownership is proven with no stored
# secrets: GitHub OIDC for the io.github.textbee namespace, and the mcpName
# field in the published package.json for the npm package.
name: MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Minting the OIDC token the registry exchanges for a publish session.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set server.json version from package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to the MCP Registry
        run: ./mcp-publisher publish
